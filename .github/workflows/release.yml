name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Import Code Signing Certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Set keychain as default
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build and Archive
        run: |
          xcodebuild -project DriveSync.xcodeproj \
            -scheme DriveSync \
            -configuration Release \
            -archivePath build/DriveSync.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: Sign App
        run: |
          APP_PATH="build/DriveSync.xcarchive/Products/Applications/DriveSync.app"

          # Sign the bundled rclone binary first (required for notarization)
          codesign --force --options runtime \
            --sign "Developer ID Application" \
            --timestamp \
            "$APP_PATH/Contents/Resources/rclone"

          # Sign the main app
          codesign --deep --force --options runtime \
            --sign "Developer ID Application" \
            --timestamp \
            "$APP_PATH"

          # Verify signature
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        run: |
          APP_PATH="build/DriveSync.xcarchive/Products/Applications/DriveSync.app"
          DMG_DIR="build/dmg"
          mkdir -p "$DMG_DIR"
          cp -R "$APP_PATH" "$DMG_DIR/"
          hdiutil create -volname "DriveSync" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "build/DriveSync-${GITHUB_REF_NAME}.dmg"

          # Sign DMG
          codesign --force --sign "Developer ID Application" \
            --timestamp \
            "build/DriveSync-${GITHUB_REF_NAME}.dmg"

      - name: Create ZIP
        run: |
          APP_PATH="build/DriveSync.xcarchive/Products/Applications/DriveSync.app"
          cd "$(dirname "$APP_PATH")"
          /usr/bin/ditto -c -k --keepParent DriveSync.app "$GITHUB_WORKSPACE/build/DriveSync-${GITHUB_REF_NAME}.zip"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Submit for notarization
          xcrun notarytool submit "build/DriveSync-${GITHUB_REF_NAME}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the notarization ticket
          xcrun stapler staple "build/DriveSync-${GITHUB_REF_NAME}.dmg"

      - name: Notarize ZIP
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "build/DriveSync-${GITHUB_REF_NAME}.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Cleanup Keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f $RUNNER_TEMP/certificate.p12

      - name: Generate Release Notes
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          COMMITS=$(git log ${PREV_TAG}..${GITHUB_REF_NAME} --pretty=format:"%s" --reverse)

          CHANGES=""
          FEATURES=""
          FIXES=""

          while IFS= read -r commit; do
            case "$commit" in
              feat:*|Feat:*|Feature:*|feature:*)
                FEATURES="${FEATURES}- ✨ ${commit#*: }\n"
                ;;
              feat\(*\):*|feat\(*\)!:*)
                msg="${commit#*: }"
                FEATURES="${FEATURES}- ✨ ${msg}\n"
                ;;
              fix:*|Fix:*|fix\(*\):*)
                FIXES="${FIXES}- 🐛 ${commit#*: }\n"
                ;;
              *)
                CHANGES="${CHANGES}- ${commit#*: }\n"
                ;;
            esac
          done <<< "$COMMITS"

          RELEASE_NOTES=""

          if [ -n "$CHANGES" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}### 🔄 What's Changed\n${CHANGES}\n"
          fi

          if [ -n "$FEATURES" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}### 🚀 New Features\n${FEATURES}\n"
          fi

          if [ -n "$FIXES" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}### 🐛 Bug Fixes\n${FIXES}\n"
          fi

          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          RELEASE_NOTES="${RELEASE_NOTES}---\n\n"
          RELEASE_NOTES="${RELEASE_NOTES}**Full Changelog**: [${PREV_TAG}...${GITHUB_REF_NAME}](${REPO_URL}/compare/${PREV_TAG}...${GITHUB_REF_NAME})\n"

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: DriveSync ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            build/DriveSync-${{ github.ref_name }}.dmg
            build/DriveSync-${{ github.ref_name }}.zip
