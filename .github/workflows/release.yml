name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        run: |
          xcodebuild -project DriveSync.xcodeproj \
            -scheme DriveSync \
            -configuration Release \
            -archivePath build/DriveSync.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        run: |
          APP_PATH="build/DriveSync.xcarchive/Products/Applications/DriveSync.app"
          DMG_DIR="build/dmg"
          mkdir -p "$DMG_DIR"
          cp -R "$APP_PATH" "$DMG_DIR/"
          hdiutil create -volname "DriveSync" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "build/DriveSync-${GITHUB_REF_NAME}.dmg"

      - name: Create ZIP
        run: |
          APP_PATH="build/DriveSync.xcarchive/Products/Applications/DriveSync.app"
          cd "$(dirname "$APP_PATH")"
          zip -r -y "$GITHUB_WORKSPACE/build/DriveSync-${GITHUB_REF_NAME}.zip" DriveSync.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: DriveSync ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/DriveSync-${{ github.ref_name }}.dmg
            build/DriveSync-${{ github.ref_name }}.zip
